<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc"><title id="title">系統總覽：C# 負責工作流程與結果驗證；Python 依指定設定呼叫 SDK</title><desc id="desc">AgentOrchestrator 協調 WorkQueue、Routing 與 Runtime 三服務。三個聚合各自儲存狀態；Runtime 經程序 adapter 呼叫 Worker。新工具驗證介面尚未完成 DI 註冊。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">01  系統總覽</text><text x="26" y="63" class="body" text-anchor="start">讀法：由上往下看控制；由左往右看 Runtime 跨程序呼叫 Worker。</text><rect x="24" y="180" width="900" height="530" rx="12" fill="#f8faff" stroke="#b8cbe6" stroke-width="1.5"/><text x="44" y="209" class="zone" text-anchor="start" style="fill:#2859a8">C#  AgentRuntime  /  流程控制與結果驗證</text><rect x="950" y="180" width="266" height="530" rx="12" fill="#f4fbf8" stroke="#9bc9bb" stroke-width="1.5"/><text x="970" y="209" class="zone" text-anchor="start" style="fill:#17695d">Python  /  單次執行</text><rect x="44" y="90" width="370" height="65" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="62" y="122" class="title" text-anchor="start" style="fill:#526173">CLI：工作定義 ＋ Routing</text><text x="62" y="147" class="small" text-anchor="start">--workitem / --routing</text><path d="M414 122 L850 122 L850 234" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="545" y="109" class="label" text-anchor="start" style="fill:#2859a8">解析與初始化</text><rect x="44" y="234" width="860" height="84" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="62" y="266" class="title" text-anchor="start" style="fill:#2859a8">AgentOrchestrator  協調執行與恢復</text><text x="62" y="294" class="body" text-anchor="start">傳遞目前 Job、流程步驟及 Runtime 結果；三個服務不直接相依。</text><path d="M174 318 L174 365" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="111" y="346" class="label" text-anchor="start" style="fill:#2859a8">取目前工作</text><path d="M474 318 L474 365" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="411" y="346" class="label" text-anchor="start" style="fill:#2859a8">開啟流程／接收結果</text><path d="M774 318 L774 365" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="711" y="346" class="label" text-anchor="start" style="fill:#2859a8">準備／執行動作</text><rect x="44" y="365" width="260" height="144" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="62" y="397" class="title" text-anchor="start" style="fill:#2859a8">WorkQueue 工作進度</text><text x="62" y="425" class="body" text-anchor="start">Queue → WorkItem → Job</text><text x="62" y="450" class="body" text-anchor="start">管理完成／中止與下一工作</text><text x="62" y="501" class="small" text-anchor="start">WorkQueueService / Aggregate</text><rect x="344" y="365" width="260" height="144" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="362" y="397" class="title" text-anchor="start" style="fill:#2859a8">Routing 決定下一步</text><text x="362" y="425" class="body" text-anchor="start">節點、子流程、COE、人工處理</text><text x="362" y="450" class="body" text-anchor="start">依驗證結果決定下一步</text><text x="362" y="501" class="small" text-anchor="start">RoutingRegisterService</text><rect x="644" y="365" width="260" height="144" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="662" y="397" class="title" text-anchor="start" style="fill:#2859a8">Runtime 執行節點</text><text x="662" y="425" class="body" text-anchor="start">準備 → 呼叫 → 驗證 → 結果</text><text x="662" y="450" class="body" text-anchor="start">待確認呼叫、重試與恢復</text><text x="662" y="501" class="small" text-anchor="start">RuntimeService / AgentRuntime</text><rect x="970" y="365" width="226" height="144" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="988" y="397" class="title" text-anchor="start" style="fill:#17695d">Worker</text><text x="988" y="425" class="body" text-anchor="start">驗證請求內容</text><text x="988" y="450" class="body" text-anchor="start">選 Codex 或 Claude</text><text x="988" y="475" class="body" text-anchor="start">以相同格式回傳結果</text><text x="988" y="501" class="small" text-anchor="start">worker.py · 無流程狀態</text><path d="M904 398 L970 398" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><path d="M970 478 L904 478" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="937" y="385" class="small" text-anchor="middle">stdin</text><text x="937" y="465" class="small" text-anchor="middle">stdout</text><text x="1078" y="548" class="small" text-anchor="middle">一次 request → 一次 SDK 執行</text><text x="1078" y="574" class="small" text-anchor="middle">stdout 回傳；異常 stderr / exit 1</text><path d="M174 509 L174 574" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><text x="109" y="548" class="label" text-anchor="start" style="fill:#526173">各自讀寫快照</text><rect x="44" y="574" width="260" height="75" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="62" y="606" class="title" text-anchor="start" style="fill:#526173">工作快照</text><text x="62" y="641" class="small" text-anchor="start">WorkQueueRepository</text><path d="M474 509 L474 574" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><text x="409" y="548" class="label" text-anchor="start" style="fill:#526173">各自讀寫快照</text><rect x="344" y="574" width="260" height="75" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="362" y="606" class="title" text-anchor="start" style="fill:#526173">流程快照</text><text x="362" y="641" class="small" text-anchor="start">FlowRepository</text><path d="M774 509 L774 574" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><text x="709" y="548" class="label" text-anchor="start" style="fill:#526173">各自讀寫快照</text><rect x="644" y="574" width="260" height="75" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="662" y="606" class="title" text-anchor="start" style="fill:#526173">執行快照</text><text x="662" y="641" class="small" text-anchor="start">RuntimeRepository</text><text x="44" y="686" class="small" text-anchor="start">快照經 IIOContext 保存；已保存通知 → EventBus → Handler。Trace 另寫日誌，不能代替快照。</text><rect x="44" y="745" width="555" height="105" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="777" class="title" text-anchor="start" style="fill:#955d12">新驗證流程：元件已實作、DI 尚未註冊</text><text x="62" y="805" class="body" text-anchor="start">IVerificationExecutor ＋ IToolRegistry 未註冊；</text><text x="62" y="830" class="body" text-anchor="start">未注入服務時，沿用既有驗證器。</text><path d="M904 490 L936 490 L936 795 L599 795" fill="none" stroke="#955d12" stroke-width="2" marker-end="url(#amber)" stroke-dasharray="7 5"/><rect x="950" y="745" width="266" height="105" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5" stroke-dasharray="7 5"/><text x="968" y="777" class="title" text-anchor="start" style="fill:#955d12">整合工作待 S7 完成</text><text x="968" y="805" class="body" text-anchor="start">人工操作 CLI、約束傳遞／保存、</text><text x="968" y="830" class="body" text-anchor="start">DI 與端到端驗證待完成。</text><text x="24" y="883" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>