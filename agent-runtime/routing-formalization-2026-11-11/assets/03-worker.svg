<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" role="img" aria-labelledby="title desc"><title id="title">Worker：依請求選擇 SDK，並以相同格式回傳結果</title><desc id="desc">Worker 只接受 invocation v4，驗證 schema、prompt 摘要與 cwd，依 sdkKind 選 Codex 或 Claude，轉成 bridge v3 回應格式。不負責工作流程重試或狀態儲存。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">03  Worker 的責任止於這一次 SDK 呼叫</text><text x="26" y="63" class="body" text-anchor="start">實作：worker.py；README 仍記載 v3 / bridge-2，這裡以本提交的原始碼為準。</text><rect x="32" y="108" width="333" height="144" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="140" class="title" text-anchor="start" style="fill:#2859a8">C# 建立執行請求</text><text x="50" y="168" class="body" text-anchor="start">WorkerInvocation v4</text><text x="50" y="193" class="body" text-anchor="start">identity、workspaceRoot、sdkKind</text><text x="50" y="218" class="body" text-anchor="start">prompt、schema、timeout</text><text x="50" y="244" class="small" text-anchor="start">stdin 或 --request-file</text><rect x="447" y="108" width="333" height="144" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="465" y="140" class="title" text-anchor="start" style="fill:#17695d">Python 驗證請求</text><text x="465" y="168" class="body" text-anchor="start">JSON 格式與重複欄位名稱</text><text x="465" y="193" class="body" text-anchor="start">schema 原始位元組與 SHA-256</text><text x="465" y="218" class="body" text-anchor="start">提示內容雜湊、工作目錄一致</text><path d="M365 180 L447 180" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="386" y="166" class="label" text-anchor="start" style="fill:#17695d">送入</text><rect x="861" y="108" width="345" height="144" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5"/><text x="879" y="140" class="title" text-anchor="start" style="fill:#955d12">驗證失敗／未處理例外</text><text x="879" y="168" class="body" text-anchor="start">stderr：sdk-bridge-error</text><text x="879" y="193" class="body" text-anchor="start">程序 exit 1</text><text x="879" y="218" class="body" text-anchor="start">不偽造成功回覆、不自行重送</text><path d="M780 180 L861 180" fill="none" stroke="#955d12" stroke-width="2" marker-end="url(#amber)"/><text x="800" y="166" class="label" text-anchor="start" style="fill:#955d12">拒絕</text><path d="M613 252 L613 300" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="629" y="284" class="label" text-anchor="start" style="fill:#17695d">通過後依 sdkKind 選擇 SDK</text><rect x="32" y="300" width="1174" height="280" rx="12" fill="#f5faf8" stroke="#a7cdbf" stroke-width="1.5"/><text x="52" y="329" class="zone" text-anchor="start" style="fill:#17695d">每次選擇一種 SDK  ·  兩者共用 WorkerResponse v2 回應格式定義</text><rect x="70" y="363" width="484" height="177" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="88" y="395" class="title" text-anchor="start" style="fill:#17695d">Codex</text><text x="88" y="423" class="body" text-anchor="start">Codex → thread_start → thread.run</text><text x="88" y="448" class="body" text-anchor="start">傳入完整 output_schema；使用臨時對話</text><text x="88" y="473" class="body" text-anchor="start">completed 後解析 final_response</text><text x="88" y="498" class="body" text-anchor="start">再次驗證 WorkerResponse v2</text><rect x="684" y="363" width="484" height="177" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="702" y="395" class="title" text-anchor="start" style="fill:#17695d">Claude</text><text x="702" y="423" class="body" text-anchor="start">ClaudeAgentOptions → query</text><text x="702" y="448" class="body" text-anchor="start">output_format：json_schema</text><text x="702" y="473" class="body" text-anchor="start">讀取 ResultMessage.structured_output</text><text x="702" y="498" class="body" text-anchor="start">再次驗證 WorkerResponse v2</text><path d="M613 348 L312 348 L312 363" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><path d="M613 348 L926 348 L926 363" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><path d="M312 540 L312 610 L613 610 L613 639" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><path d="M926 540 L926 610 L613 610" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><rect x="32" y="639" width="1174" height="143" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="50" y="671" class="title" text-anchor="start" style="fill:#17695d">共同回應格式：agent-runtime-sdk-bridge-3</text><text x="50" y="699" class="body" text-anchor="start">structured  /  missingStructuredOutput  /  structuredRetriesExhausted  /  executionFailed</text><text x="50" y="724" class="body" text-anchor="start">invocationId、SDK 種類／版本、session／turn、時間、usage、agentOutput、原始回覆</text><text x="50" y="749" class="body" text-anchor="start">SDK 未提供的欄位保留 null；只有 structured 回應包含 agentOutput。</text><text x="32" y="821" class="small" text-anchor="start">C# 負責結果驗證、流程控制、狀態儲存與重試；SDK 內部重試不等於重新執行工作流程。</text><text x="24" y="843" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>