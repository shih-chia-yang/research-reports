<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1190" role="img" aria-labelledby="title desc"><title id="title">AgentOrchestrator：協調三個服務的執行、恢復與結束</title><desc id="desc">協調者依 Routing continuation 決定呼叫哪個服務。WorkQueue 管工作位置，Routing 管節點，Runtime 管執行；三服務各自保存狀態。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">07  AgentOrchestrator：把三個服務串成一次可接續的執行</text><text x="26" y="63" class="body" text-anchor="start">由 ExecuteAsync 接收工作與 Routing 路徑；依服務回傳的狀態協調，不直接修改三個聚合。</text><rect x="50" y="105" width="660" height="105" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="68" y="137" class="title" text-anchor="start" style="fill:#2859a8">① 初始化工作清單</text><text x="68" y="165" class="body" text-anchor="start">WorkQueue.InitializeAsync：載入／恢復 Queue，取得 Routing 定義。</text><text x="68" y="190" class="body" text-anchor="start">輸入不合法或初始化失敗 → 直接回傳原因。</text><path d="M380 210 L380 255" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><rect x="50" y="255" width="660" height="115" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="68" y="287" class="title" text-anchor="start" style="fill:#2859a8">② 取得目前 Job，再開啟或恢復流程</text><text x="68" y="315" class="body" text-anchor="start">PrepareCurrentJobAsync → Routing.OpenAsync</text><text x="68" y="340" class="body" text-anchor="start">沿用已保存的流程執行 ID；每次循環先重新讀取目前工作。</text><text x="68" y="362" class="small" text-anchor="start">WorkQueue 管工作位置；Routing 回傳 FlowContinuation</text><path d="M380 370 L380 425" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><rect x="50" y="425" width="660" height="115" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="68" y="457" class="title" text-anchor="start" style="fill:#2859a8">③ 需要恢復時，先核對 Runtime</text><text x="68" y="485" class="body" text-anchor="start">ReadRecoveryAsync：已有結果 → 先交給 Routing 接受</text><text x="68" y="510" class="body" text-anchor="start">只有確認不需執行舊動作，才開始新一輪 CLI 流程。</text><text x="68" y="532" class="small" text-anchor="start">要求恢復的 Runtime 快照若不存在，回報失敗</text><path d="M380 540 L380 595" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="398" y="572" class="label" text-anchor="start" style="fill:#2859a8">依 Routing 回傳狀態分流</text><rect x="50" y="595" width="660" height="125" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="68" y="627" class="title" text-anchor="start" style="fill:#2859a8">④ 有節點要執行 → 準備並綁定 Runtime</text><text x="68" y="655" class="body" text-anchor="start">PrepareAsync → 必要時 BindExecutionAsync</text><text x="68" y="680" class="body" text-anchor="start">重驗或完成階段：先呼叫 RecheckAsync／PrepareCompletionAsync</text><text x="68" y="705" class="body" text-anchor="start">執行 ExecuteActionAsync，得到已保存的動作結果。</text><path d="M380 720 L380 775" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><rect x="50" y="775" width="660" height="115" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="68" y="807" class="title" text-anchor="start" style="fill:#2859a8">⑤ 把結果交給 Routing，依狀態繼續</text><text x="68" y="835" class="body" text-anchor="start">AcceptResultAsync → 由 Routing 決定下一個節點或停止狀態</text><text x="68" y="860" class="body" text-anchor="start">繼續時回到②：同一 Job 執行下一步，已結束才前進工作。</text><text x="68" y="882" class="small" text-anchor="start">RuntimeActionResult → FlowContinuation</text><path d="M50 832 L24 832 L24 310 L50 310" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="800" y="121" class="zone" text-anchor="start">不執行節點時的處理</text><rect x="800" y="150" width="408" height="165" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="818" y="182" class="title" text-anchor="start" style="fill:#2859a8">工作已完成或中止</text><text x="818" y="210" class="body" text-anchor="start">Routing 提供 FlowClosureReceipt</text><text x="818" y="235" class="body" text-anchor="start">→ WorkQueue.AdvanceAsync</text><text x="818" y="260" class="body" text-anchor="start">→ 回到②，取得下一個 Job／Work</text><text x="818" y="285" class="body" text-anchor="start">中止工作另外列入 AbortedWorks。</text><text x="818" y="307" class="small" text-anchor="start">JobCompleted / JobAborted</text><rect x="800" y="345" width="408" height="150" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="818" y="377" class="title" text-anchor="start" style="fill:#69509a">暫停或等待人工核准</text><text x="818" y="405" class="body" text-anchor="start">回傳目前位置與人工處理通知</text><text x="818" y="430" class="body" text-anchor="start">Queue 保持原位，本輪 CLI 結束</text><text x="818" y="455" class="body" text-anchor="start">暫停 exit 12；等待核准 exit 13</text><text x="818" y="480" class="body" text-anchor="start">通知送出失敗會註記，等待狀態仍保留。</text><rect x="800" y="540" width="408" height="150" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="818" y="572" class="title" text-anchor="start" style="fill:#69509a">Routing 要求停止</text><text x="818" y="600" class="body" text-anchor="start">回傳人工檢查、COE 耗盡或失敗原因</text><text x="818" y="625" class="body" text-anchor="start">需要時取得報告與 Trace 路徑</text><text x="818" y="650" class="body" text-anchor="start">記錄 Work／Job／節點位置</text><text x="818" y="675" class="body" text-anchor="start">取消執行則向上傳遞取消訊號。</text><rect x="800" y="735" width="408" height="155" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="818" y="767" class="title" text-anchor="start" style="fill:#526173">Queue 沒有下一份工作</text><text x="818" y="795" class="body" text-anchor="start">回傳 Completed 與快照／Trace 位置</text><text x="818" y="820" class="body" text-anchor="start">同時列出 AbortedWorks</text><text x="818" y="845" class="body" text-anchor="start">整輪結束仍可能包含中止工作，</text><text x="818" y="870" class="body" text-anchor="start">應一併查看這份清單。</text><path d="M710 310 L755 310" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M710 482 L755 482" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M710 832 L755 832" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M755 225 V832" fill="none" stroke="#526173" stroke-width="2"/><path d="M755 225 L800 225" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M755 420 L800 420" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M755 615 L800 615" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M755 812 L800 812" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><rect x="50" y="941" width="1158" height="118" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="68" y="973" class="title" text-anchor="start" style="fill:#526173">保存責任仍在各服務：協調者負責傳遞工作、流程步驟與執行結果</text><text x="68" y="1001" class="body" text-anchor="start">WorkQueueRepository 保存工作進度；FlowRepository 保存流程；RuntimeRepository 保存執行狀態。</text><text x="68" y="1026" class="body" text-anchor="start">Trace 用於追查過程，不能代替快照。新工具驗證 DI、人工操作 CLI、JobConstraints 傳遞仍待 S7。</text><text x="50" y="1110" class="body" text-anchor="start">讀圖順序：左側沿執行循環往下；右側是依目前狀態採取的處理，不會依序全部執行。</text><text x="24" y="1173" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>