<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" role="img" aria-labelledby="title desc"><title id="title">Routing：一般節點、子流程、人工核准與異常處置</title><desc id="desc">能力示意而非固定業務 Routing。FlowHolder 根據節點型態分派，子流程保存子流程呼叫紀錄，人工處理保存後由下一次執行接續；Host 人工操作 CLI 尚未接通。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">04  Routing 管理「下一步」，也管理何時停下</text><text x="26" y="63" class="body" text-anchor="start">這是本分支支援的選路能力圖；不是一份固定的業務 Routing 定義。</text><rect x="415" y="94" width="410" height="86" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="433" y="126" class="title" text-anchor="start" style="fill:#2859a8">FlowHolder 定位目前節點</text><text x="433" y="154" class="body" text-anchor="start">依據執行結果、鎖定定義與呼叫紀錄</text><path d="M620 180 L620 208 L208 208 L208 253" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="158" y="238" class="label" text-anchor="start" style="fill:#2859a8">一般節點</text><path d="M620 180 L620 208 L620 208 L620 253" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="570" y="238" class="label" text-anchor="start" style="fill:#2859a8">Subflow</text><path d="M620 180 L620 208 L1032 208 L1032 253" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="982" y="238" class="label" text-anchor="start" style="fill:#2859a8">HumanApproval</text><rect x="32" y="253" width="352" height="147" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="285" class="title" text-anchor="start" style="fill:#2859a8">交給 Runtime 執行</text><text x="50" y="313" class="body" text-anchor="start">Begin / Normal / End</text><text x="50" y="338" class="body" text-anchor="start">檢查項 → 驗證結果 → 唯一去向</text><text x="50" y="363" class="body" text-anchor="start">終點完成動作驗證後才可關閉</text><text x="50" y="392" class="small" text-anchor="start">一般節點須宣告 requirement / branch</text><rect x="444" y="253" width="352" height="147" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="462" y="285" class="title" text-anchor="start" style="fill:#2859a8">進入子流程</text><text x="462" y="313" class="body" text-anchor="start">以內容雜湊定位 Routing</text><text x="462" y="338" class="body" text-anchor="start">記錄呼叫端與子流程的對應</text><text x="462" y="363" class="body" text-anchor="start">以 MaxCallDepth 限制深度</text><text x="462" y="392" class="small" text-anchor="start">FlowHolder.CallStack</text><rect x="856" y="253" width="352" height="147" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="874" y="285" class="title" text-anchor="start" style="fill:#69509a">等待人工核准</text><text x="874" y="313" class="body" text-anchor="start">保存 AwaitingApprovalRecord</text><text x="874" y="338" class="body" text-anchor="start">回報 awaiting_approval / exit 13</text><text x="874" y="363" class="body" text-anchor="start">Queue 停留；不派送這個核准節點</text><text x="874" y="392" class="small" text-anchor="start">通知送出失敗也不改流程狀態</text><path d="M208 400 L208 458" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="226" y="434" class="label" text-anchor="start" style="fill:#2859a8">依驗證結果決定下一步</text><rect x="32" y="458" width="352" height="143" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="490" class="title" text-anchor="start" style="fill:#2859a8">後續依定義決定</text><text x="50" y="518" class="body" text-anchor="start">下一節點／同節點重試</text><text x="50" y="543" class="body" text-anchor="start">轉入 COE 異常流程</text><text x="50" y="568" class="body" text-anchor="start">原動作重新驗證／停止</text><text x="50" y="593" class="small" text-anchor="start">依步數上限及業務／COE 重試限制</text><path d="M620 400 L620 458" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="638" y="434" class="label" text-anchor="start" style="fill:#2859a8">子流程終點完成驗證</text><rect x="444" y="458" width="352" height="143" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="462" y="490" class="title" text-anchor="start" style="fill:#2859a8">返回呼叫節點</text><text x="462" y="518" class="body" text-anchor="start">移除呼叫紀錄，取得宣告的結果碼</text><text x="462" y="543" class="body" text-anchor="start">選唯一去向；非成功結果</text><text x="462" y="568" class="body" text-anchor="start">該子流程原有驗收結果改為未通過</text><text x="462" y="593" class="small" text-anchor="start">返回成功仍須滿足所有必要驗收</text><path d="M1032 400 L1032 458" fill="none" stroke="#69509a" stroke-width="2" marker-end="url(#purple)"/><text x="837" y="434" class="label" text-anchor="start" style="fill:#69509a">核准／退回（服務已有實作）</text><rect x="856" y="458" width="352" height="143" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="874" y="490" class="title" text-anchor="start" style="fill:#69509a">HumanDecisionService</text><text x="874" y="518" class="body" text-anchor="start">核對等待紀錄的識別碼與狀態</text><text x="874" y="543" class="body" text-anchor="start">經 Routing 儲存人工處理結果</text><text x="874" y="568" class="body" text-anchor="start">不派送；由下一次執行接續</text><text x="874" y="593" class="small" text-anchor="start">恢復／中止另對應 Paused 狀態</text><rect x="32" y="672" width="764" height="132" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="50" y="704" class="title" text-anchor="start" style="fill:#69509a">約束違反／驗收變更 → 暫停待人處理</text><text x="50" y="732" class="body" text-anchor="start">Flow 保存 PauseRecord ＋ 呼叫路徑 ＋ 證據；回報 paused_for_human / exit 12。</text><text x="50" y="757" class="body" text-anchor="start">恢復依原因重驗；中止保存後同步 FlowAborted，讓 Queue 跳過該 Work。</text><path d="M208 601 L208 672" fill="none" stroke="#69509a" stroke-width="2" marker-end="url(#purple)"/><text x="226" y="646" class="label" text-anchor="start" style="fill:#69509a">需人工處理時</text><rect x="856" y="672" width="352" height="132" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5" stroke-dasharray="7 5"/><text x="874" y="704" class="title" text-anchor="start" style="fill:#955d12">Host 的人工處理 CLI 尚未接通</text><text x="874" y="732" class="body" text-anchor="start">CLI 目前只接受兩個檔案參數。</text><text x="874" y="757" class="body" text-anchor="start">上方人工處理服務雖已實作，</text><text x="874" y="782" class="body" text-anchor="start">尚無對應的 CLI 操作指令。</text><path d="M1032 601 L1032 672" fill="none" stroke="#955d12" stroke-width="2" marker-end="url(#amber)" stroke-dasharray="7 5"/><text x="32" y="862" class="body" text-anchor="start">整合缺口：Work 的 JobConstraints 保存與傳遞仍待 S7；FlowOpenRequest 已有介面，Orchestrator 尚未傳入。</text><text x="32" y="891" class="small" text-anchor="start">恢復與完成：Work、Flow、Runtime 各自還原；完成必要通知與狀態儲存後，Queue 才處理下一項。</text><text x="24" y="923" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>