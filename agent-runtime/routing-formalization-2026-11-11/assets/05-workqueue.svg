<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1080" role="img" aria-labelledby="title desc"><title id="title">WorkQueue：保存工作順序，確認流程結束後才前進</title><desc id="desc">WorkQueueAggregate 管理 WorkLedger 與 WorkJob。Job 開始、完成通知與流程結束確認為不同步驟；中止會略過同一 Work 尚未執行的 Job。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">05  WorkQueue：目前做到哪一份工作、哪一個 Job</text><text x="26" y="63" class="body" text-anchor="start">這是依序執行、可保存與恢復的工作清單；流程節點由 Routing 決定。</text><rect x="32" y="100" width="364" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="132" class="title" text-anchor="start" style="fill:#2859a8">Queue：整批工作的順序</text><text x="50" y="160" class="body" text-anchor="start">WorkItem A → WorkItem B → …</text><text x="50" y="185" class="body" text-anchor="start">保存目前工作位置、完成與中止紀錄</text><text x="50" y="237" class="small" text-anchor="start">WorkQueueAggregate</text><rect x="438" y="100" width="364" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="456" y="132" class="title" text-anchor="start" style="fill:#2859a8">Work：一份工作的進度</text><text x="456" y="160" class="body" text-anchor="start">保存工作定義、工作區與 Routing 摘要</text><text x="456" y="185" class="body" text-anchor="start">Job 1 → Job 2 → …，依序處理</text><text x="456" y="237" class="small" text-anchor="start">WorkLedger</text><rect x="844" y="100" width="364" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="862" y="132" class="title" text-anchor="start" style="fill:#2859a8">Job：一次流程執行</text><text x="862" y="160" class="body" text-anchor="start">保存狀態、執行次數與流程執行 ID</text><text x="862" y="185" class="body" text-anchor="start">完成及結束確認各有獨立紀錄</text><text x="862" y="237" class="small" text-anchor="start">WorkJob</text><path d="M396 172 L438 172" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><path d="M802 172 L844 172" fill="none" stroke="#526173" stroke-width="2" marker-end="url(#gray)"/><text x="32" y="289" class="zone" text-anchor="start">正常路徑  /  開始、完成、前進是三個不同時點</text><rect x="32" y="320" width="280" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="352" class="title" text-anchor="start" style="fill:#2859a8">① 尚未開始 → 執行中</text><text x="50" y="380" class="body" text-anchor="start">Pending → Running</text><text x="50" y="405" class="body" text-anchor="start">建立並保存流程執行 ID</text><text x="50" y="430" class="body" text-anchor="start">執行次數加一後發布 JobBegan</text><text x="50" y="457" class="small" text-anchor="start">PrepareCurrentJobAsync</text><rect x="436" y="320" width="330" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="454" y="352" class="title" text-anchor="start" style="fill:#2859a8">② Routing 執行這個 Job</text><text x="454" y="380" class="body" text-anchor="start">Orchestrator 取得目前 Job</text><text x="454" y="405" class="body" text-anchor="start">同一 Job 可包含多個節點</text><text x="454" y="430" class="body" text-anchor="start">恢復 Running 時沿用流程執行 ID</text><text x="454" y="457" class="small" text-anchor="start">WorkQueue 不決定節點或 SDK 重試</text><rect x="890" y="320" width="318" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="908" y="352" class="title" text-anchor="start" style="fill:#2859a8">③ 接受完成通知</text><text x="908" y="380" class="body" text-anchor="start">FlowCompletedHandler</text><text x="908" y="405" class="body" text-anchor="start">驗證 FlowCompletedFact 並保存</text><text x="908" y="430" class="body" text-anchor="start">Job → Completed；位置還沒前進</text><text x="908" y="457" class="small" text-anchor="start">AcceptCompletion</text><path d="M312 392 L436 392" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="330" y="378" class="label" text-anchor="start" style="fill:#2859a8">交給協調者</text><path d="M766 392 L890 392" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="780" y="378" class="label" text-anchor="start" style="fill:#2859a8">流程完成通知</text><path d="M1049 465 L1049 535" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="825" y="509" class="label" text-anchor="start" style="fill:#2859a8">完成通知已處理、流程已保存</text><rect x="844" y="535" width="364" height="125" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="862" y="567" class="title" text-anchor="start" style="fill:#2859a8">④ Routing 提供結束確認</text><text x="862" y="595" class="body" text-anchor="start">FlowClosureReceipt</text><text x="862" y="620" class="body" text-anchor="start">包含同一 Job、流程與事件識別</text><text x="862" y="652" class="small" text-anchor="start">Orchestrator → AdvanceAsync</text><rect x="438" y="535" width="364" height="125" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="456" y="567" class="title" text-anchor="start" style="fill:#2859a8">⑤ WorkQueue 核對並前進</text><text x="456" y="595" class="body" text-anchor="start">核對完成事實與同步後的流程版本</text><text x="456" y="620" class="body" text-anchor="start">同一 Work 還有 Job → 下一個 Job</text><text x="456" y="652" class="small" text-anchor="start">全部 Job 結束 → 記錄 Work 完成</text><rect x="32" y="535" width="364" height="125" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="567" class="title" text-anchor="start" style="fill:#2859a8">⑥ 繼續下一份工作</text><text x="50" y="595" class="body" text-anchor="start">目前 Work 全部完成後，Queue 前進</text><text x="50" y="620" class="body" text-anchor="start">直到所有工作均完成或中止</text><text x="50" y="652" class="small" text-anchor="start">Current / PrepareCurrentJobAsync</text><path d="M844 597 L802 597" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><path d="M438 597 L396 597" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="32" y="712" class="zone" text-anchor="start" style="fill:#69509a">中止路徑  /  同一份工作的剩餘 Job 一併中止，其他工作仍可繼續</text><rect x="32" y="742" width="560" height="130" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="50" y="774" class="title" text-anchor="start" style="fill:#69509a">人工中止 → 保存中止事實</text><text x="50" y="802" class="body" text-anchor="start">FlowAbortedHandler → AcceptAbort</text><text x="50" y="827" class="body" text-anchor="start">目前 Running Job 與同一 Work 的其餘 Pending Job</text><text x="50" y="852" class="body" text-anchor="start">標為 Aborted；此時仍不移動 Queue 位置。</text><rect x="674" y="742" width="534" height="130" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="692" y="774" class="title" text-anchor="start" style="fill:#69509a">取得中止的結束確認 → 下一份 Work</text><text x="692" y="802" class="body" text-anchor="start">AdvanceAsync 核對中止事實與流程版本</text><text x="692" y="827" class="body" text-anchor="start">保存 AbortedWorks，略過這份 Work 剩餘 Job</text><text x="692" y="852" class="body" text-anchor="start">中止紀錄與完成紀錄分開保存。</text><path d="M592 806 L674 806" fill="none" stroke="#69509a" stroke-width="2" marker-end="url(#purple)"/><text x="603" y="792" class="label" text-anchor="start" style="fill:#69509a">確認後</text><rect x="32" y="914" width="1176" height="112" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="50" y="946" class="title" text-anchor="start" style="fill:#526173">保存與恢復：WorkQueueService / WorkQueueRepository</text><text x="50" y="974" class="body" text-anchor="start">Queue 與所屬 Work、Job 由同一聚合管理；寫入時核對版本，恢復時核對工作定義與 Routing 摘要。</text><text x="50" y="999" class="body" text-anchor="start">相同完成／中止通知可重送；相同識別卻有不同內容時拒絕。JobConstraints 的保存與傳遞仍待 S7。</text><text x="24" y="1063" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>