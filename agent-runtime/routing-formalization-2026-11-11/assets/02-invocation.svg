<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc"><title id="title">一次呼叫：先保存 pending，再跨程序執行，回來後由 C# 驗證</title><desc id="desc">泳道依序為 Routing、Runtime、程序 Adapter、Python Worker 與 SDK。呼叫前保存，回報不是完成證明；新工具驗證流程的 DI 以虛線標示。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">02  一個節點如何執行與驗證</text><text x="26" y="63" class="body" text-anchor="start">以下為正常回報路徑；只有驗證後的結果才交給 Routing 決定下一步。</text><rect x="20" y="94" width="200" height="58" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="38" y="126" class="title" text-anchor="start" style="fill:#2859a8">Routing</text><path d="M120 152 V800" stroke="#cad5e1" stroke-dasharray="4 6"/><rect x="260" y="94" width="200" height="58" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="278" y="126" class="title" text-anchor="start" style="fill:#2859a8">Runtime</text><path d="M360 152 V800" stroke="#cad5e1" stroke-dasharray="4 6"/><rect x="500" y="94" width="200" height="58" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="518" y="126" class="title" text-anchor="start" style="fill:#2859a8">程序 Adapter</text><path d="M600 152 V800" stroke="#cad5e1" stroke-dasharray="4 6"/><rect x="740" y="94" width="200" height="58" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="758" y="126" class="title" text-anchor="start" style="fill:#17695d">Worker</text><path d="M840 152 V800" stroke="#cad5e1" stroke-dasharray="4 6"/><rect x="1000" y="94" width="200" height="58" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="1018" y="126" class="title" text-anchor="start" style="fill:#17695d">Codex / Claude</text><path d="M1100 152 V800" stroke="#cad5e1" stroke-dasharray="4 6"/><path d="M120 196 L360 196" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="128" y="184" class="label" text-anchor="start" style="fill:#2859a8">① 傳入步驟（經 Orchestrator）</text><rect x="250" y="227" width="220" height="100" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="268" y="259" class="title" text-anchor="start" style="fill:#2859a8">② 呼叫前檢查</text><text x="268" y="287" class="body" text-anchor="start">工作區基準與保護項目</text><text x="268" y="319" class="small" text-anchor="start">先儲存待確認呼叫紀錄</text><path d="M360 353 L600 353" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="368" y="340" class="label" text-anchor="start" style="fill:#2859a8">③ ExecuteAsync(invocation)</text><path d="M600 404 L840 404" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="608" y="391" class="label" text-anchor="start" style="fill:#17695d">④ stdin：invocation v4</text><rect x="737" y="439" width="206" height="82" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="755" y="471" class="title" text-anchor="start" style="fill:#17695d">⑤ 驗證請求</text><text x="755" y="499" class="body" text-anchor="start">格式／雜湊／工作目錄</text><path d="M840 553 L1100 553" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="848" y="540" class="label" text-anchor="start" style="fill:#17695d">⑥ 提示內容與回應格式定義</text><path d="M1100 609 L840 609" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="872" y="596" class="label" text-anchor="start" style="fill:#17695d">SDK 結果／結構化輸出</text><path d="M840 658 L600 658" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="625" y="645" class="label" text-anchor="start" style="fill:#17695d">⑦ stdout：bridge v3</text><path d="M600 706 L360 706" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="375" y="693" class="label" text-anchor="start" style="fill:#2859a8">⑧ 程序執行結果與原始輸出</text><rect x="250" y="745" width="425" height="79" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="268" y="777" class="title" text-anchor="start" style="fill:#2859a8">⑨ C# 解碼、獨立驗證與 Gate</text><text x="268" y="805" class="body" text-anchor="start">儲存檢查結果與 RuntimeActionResult</text><path d="M250 788 L120 788" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="126" y="773" class="label" text-anchor="start" style="fill:#2859a8">⑩ 接收結果</text><rect x="760" y="745" width="440" height="79" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5" stroke-dasharray="7 5"/><text x="778" y="777" class="title" text-anchor="start" style="fill:#955d12">VerificationExecutor 驗證流程</text><text x="778" y="805" class="body" text-anchor="start">尚待 DI 註冊，正式入口目前無法使用。</text><path d="M760 785 L675 785" fill="none" stroke="#955d12" stroke-width="2" marker-end="url(#amber)" stroke-dasharray="7 5"/><text x="26" y="864" class="body" text-anchor="start">中斷後恢復：讀取待確認呼叫紀錄 → Reconcile 核對執行狀態；無法確認時不重新執行。</text><text x="24" y="913" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>