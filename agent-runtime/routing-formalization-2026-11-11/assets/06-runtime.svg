<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1190" role="img" aria-labelledby="title desc"><title id="title">Runtime：執行動作、驗證結果、控制補正與恢復</title><desc id="desc">RuntimeService 處理 I/O，Domain AgentRuntime 與 Gate 判斷結果。呼叫前保存 pending，結果不確定時先核對證據；新工具驗證的 DI 尚待整合。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2859a8"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17695d"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69509a"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#955d12"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526173"/></marker></defs><style>text{font-family:system-ui,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#203247}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526173}.mono{font:14px ui-monospace,monospace}.label{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.zone{font-size:15px;font-weight:700;letter-spacing:1px}</style><rect width="1240" height="100%" fill="#fff"/><text x="26" y="34" class="title" text-anchor="start">06  Runtime：把一個節點執行成可驗證、可恢復的結果</text><text x="26" y="63" class="body" text-anchor="start">RuntimeService 負責讀寫與呼叫；Domain AgentRuntime ＋ Gate 負責結果判定及補正次數。</text><rect x="32" y="105" width="350" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="137" class="title" text-anchor="start" style="fill:#2859a8">① 準備或恢復執行狀態</text><text x="50" y="165" class="body" text-anchor="start">依 Job、節點與工作區建立 RuntimeTask</text><text x="50" y="190" class="body" text-anchor="start">已有快照 → 核對同一任務後恢復</text><text x="50" y="215" class="body" text-anchor="start">動作：Workspace／Process／Completion</text><text x="50" y="242" class="small" text-anchor="start">PrepareAsync / ExecuteActionAsync</text><rect x="445" y="105" width="350" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="463" y="137" class="title" text-anchor="start" style="fill:#2859a8">② 呼叫前檢查並保存</text><text x="463" y="165" class="body" text-anchor="start">擷取工作區基準；檢查受保護項目</text><text x="463" y="190" class="body" text-anchor="start">建立 invocation ID、提示內容與預算</text><text x="463" y="215" class="body" text-anchor="start">先保存 pending，成功後才可呼叫</text><text x="463" y="242" class="small" text-anchor="start">Precheck → PrepareInvocation → Save</text><rect x="858" y="105" width="350" height="145" rx="12" fill="#eaf7f4" stroke="#17695d" stroke-width="1.5"/><text x="876" y="137" class="title" text-anchor="start" style="fill:#17695d">③ 呼叫 Worker、保存回應</text><text x="876" y="165" class="body" text-anchor="start">經程序 Adapter 執行一次 SDK 呼叫</text><text x="876" y="190" class="body" text-anchor="start">核對回應識別並保存原始執行結果</text><text x="876" y="215" class="body" text-anchor="start">收到回應後，即使取消也先保存</text><text x="876" y="242" class="small" text-anchor="start">ExecuteAsync / RecordFeedback</text><path d="M382 178 L445 178" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><path d="M795 178 L858 178" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><path d="M1033 250 L1033 330" fill="none" stroke="#17695d" stroke-width="2" marker-end="url(#teal)"/><text x="1048" y="297" class="label" text-anchor="start" style="fill:#17695d">回應已保存</text><rect x="858" y="330" width="350" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="876" y="362" class="title" text-anchor="start" style="fill:#2859a8">④ 解碼並獨立驗證</text><text x="876" y="390" class="body" text-anchor="start">檢查回應格式、範圍及可信證據</text><text x="876" y="415" class="body" text-anchor="start">Process 可檢查報告；Completion</text><text x="876" y="440" class="body" text-anchor="start">另查 Git 工作區與提交是否存在</text><text x="876" y="467" class="small" text-anchor="start">Decoder / MechanicalVerifier</text><rect x="445" y="330" width="350" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="463" y="362" class="title" text-anchor="start" style="fill:#2859a8">⑤ 判斷本次結果</text><text x="463" y="390" class="body" text-anchor="start">Gate 核對要求、觀測結果與證據</text><text x="463" y="415" class="body" text-anchor="start">政策約束、執行安全與補正上限</text><text x="463" y="440" class="body" text-anchor="start">共同決定下一個 Runtime 動作</text><text x="463" y="467" class="small" text-anchor="start">AgentRuntime.Observe</text><rect x="32" y="330" width="350" height="145" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="50" y="362" class="title" text-anchor="start" style="fill:#2859a8">⑥ 保存判斷與執行歷程</text><text x="50" y="390" class="body" text-anchor="start">保留 SDK 呼叫、驗證與判斷紀錄</text><text x="50" y="415" class="body" text-anchor="start">可再執行、重讀證據，或結束動作</text><text x="50" y="440" class="body" text-anchor="start">結束時保存 RuntimeActionResult</text><text x="50" y="467" class="small" text-anchor="start">RuntimeRepository / Finish</text><path d="M858 402 L795 402" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><path d="M445 402 L382 402" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><path d="M207 475 L207 555" fill="none" stroke="#2859a8" stroke-width="2" marker-end="url(#blue)"/><text x="222" y="522" class="label" text-anchor="start" style="fill:#2859a8">依判斷分流</text><rect x="32" y="555" width="1176" height="184" rx="12" fill="#f8faff" stroke="#b8cbe6" stroke-width="1.5"/><text x="52" y="586" class="zone" text-anchor="start">Runtime 的判斷如何影響執行</text><rect x="52" y="606" width="350" height="113" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="70" y="638" class="title" text-anchor="start" style="fill:#2859a8">繼續／補正／修復</text><text x="70" y="666" class="body" text-anchor="start">回到②，重新檢查後建立下一次呼叫</text><text x="70" y="691" class="body" text-anchor="start">僅在可安全執行且未超過次數上限時</text><text x="70" y="711" class="small" text-anchor="start">Continue / CorrectResponse / Repair</text><rect x="445" y="606" width="350" height="113" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="463" y="638" class="title" text-anchor="start" style="fill:#2859a8">重新讀取證據</text><text x="463" y="666" class="body" text-anchor="start">回到④，重新觀測已保存的呼叫結果</text><text x="463" y="691" class="body" text-anchor="start">這條路徑不重新呼叫 Worker</text><text x="463" y="711" class="small" text-anchor="start">ReadEvidence</text><rect x="838" y="606" width="350" height="113" rx="12" fill="#eef4ff" stroke="#2859a8" stroke-width="1.5"/><text x="856" y="638" class="title" text-anchor="start" style="fill:#2859a8">結束動作 → 交給 Routing</text><text x="856" y="666" class="body" text-anchor="start">通過、耗盡、失敗、人工處理、</text><text x="856" y="691" class="body" text-anchor="start">約束未滿足、狀態不確定或取消</text><text x="856" y="711" class="small" text-anchor="start">由 Orchestrator 傳遞結果</text><text x="32" y="783" class="zone" text-anchor="start">中斷恢復  /  有 pending、沒有已保存回應時，先 Reconcile 核對執行紀錄</text><rect x="32" y="810" width="350" height="142" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="50" y="842" class="title" text-anchor="start" style="fill:#526173">證實尚未送出</text><text x="50" y="870" class="body" text-anchor="start">證據相符且工作區基準未改變</text><text x="50" y="895" class="body" text-anchor="start">重新檢查受保護項目後才執行</text><text x="50" y="920" class="body" text-anchor="start">沿用原 invocation ID、提示與預算</text><text x="50" y="944" class="small" text-anchor="start">NeverSent</text><rect x="445" y="810" width="350" height="142" rx="12" fill="#f4f6f8" stroke="#526173" stroke-width="1.5"/><text x="463" y="842" class="title" text-anchor="start" style="fill:#526173">證實已執行完畢</text><text x="463" y="870" class="body" text-anchor="start">證據相符、程序確實結束</text><text x="463" y="895" class="body" text-anchor="start">外部變更已確定後採用既有回應</text><text x="463" y="920" class="body" text-anchor="start">接回④進行驗證</text><text x="463" y="944" class="small" text-anchor="start">Completed</text><rect x="858" y="810" width="350" height="142" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="876" y="842" class="title" text-anchor="start" style="fill:#69509a">仍無法確認</text><text x="876" y="870" class="body" text-anchor="start">以不確定的執行結果進入判定</text><text x="876" y="895" class="body" text-anchor="start">不直接重新呼叫 Worker</text><text x="876" y="920" class="body" text-anchor="start">避免重複產生外部變更</text><text x="876" y="944" class="small" text-anchor="start">Uncertain</text><rect x="32" y="994" width="560" height="135" rx="12" fill="#f4f0fc" stroke="#69509a" stroke-width="1.5"/><text x="50" y="1026" class="title" text-anchor="start" style="fill:#69509a">呼叫前未通過 → 停下處理</text><text x="50" y="1054" class="body" text-anchor="start">受保護項目不成立或無法確認時不送出呼叫。</text><text x="50" y="1079" class="body" text-anchor="start">政策約束未通過以 PolicyHold 交給 Routing；</text><text x="50" y="1104" class="body" text-anchor="start">超過補正上限以 Exhausted 結束本次動作。</text><rect x="650" y="994" width="558" height="135" rx="12" fill="#fff6e7" stroke="#955d12" stroke-width="1.5" stroke-dasharray="7 5"/><text x="668" y="1026" class="title" text-anchor="start" style="fill:#955d12">目前整合缺口：新工具驗證的 DI</text><text x="668" y="1054" class="body" text-anchor="start">IVerificationExecutor / IToolRegistry 尚未註冊。</text><text x="668" y="1079" class="body" text-anchor="start">未注入服務時沿用既有驗證器；圖中的工具驗證</text><text x="668" y="1104" class="body" text-anchor="start">能力不能解讀為正式入口已全部串接完成。</text><text x="24" y="1173" class="small" text-anchor="start">feature/routing-formalization · 89c785f1 · 程式版本快照 · 實線＝已有呼叫／儲存功能；虛線＝尚待串接（不代表驗收通過）</text></svg>